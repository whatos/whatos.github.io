<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>纸屿 · 管理后台</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f5f0e6'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23c8451f'/%3E%3C/svg%3E">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<style>
  /* 登录前的小提示（登录成功后不会显示） */
  body{background:#f5f0e4;font-family:Georgia,"Noto Serif SC",serif}
</style>
</head>
<body>
<script src="https://unpkg.com/decap-cms@^3.1.1/dist/decap-cms.js"></script>
<script>
  /* 访客误进后台时，引导去登录 */
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on("init", function (user) {
      if (!user) {
        window.netlifyIdentity.on("login", function () {
          location.href = "/admin/";
        });
      }
    });
  }
</script>
</body>
</html>
